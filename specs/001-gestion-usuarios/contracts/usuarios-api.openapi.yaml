openapi: 3.1.0
info:
  title: Kryon – Gestión de Usuarios API
  version: 0.1.0
  description: |
    Contrato de la feature 001-gestion-usuarios.

    Reglas transversales:
    - La empresa SIEMPRE se deriva del token verificado. Ninguna solicitud acepta `empresaId` (FR-001, FR-023).
    - Un usuario de otra empresa responde exactamente igual que uno inexistente: 404 `usuario-no-encontrado` (FR-003).
    - Todo error es ProblemDetails (RFC 9457) sin detalles internos (FR-041).
    - Cualquier operación puede responder 500 `error-interno` (respuesta común `ErrorInterno`) ante una excepción
      no controlada. Ese cuerpo es genérico: sin stack trace, SQL, rutas del servidor, nombres internos ni secretos.
    - Autenticación: la define la futura spec de autenticación. Aquí solo se declara un esquema bearer.
    - `x-permiso`: nombres PROVISIONALES de contrato (placeholders). No son un catálogo definitivo; la API los
      asocia por configuración a los permisos reales del catálogo de roles.
    - Valores por defecto y máximos de paginación y longitudes de texto: decisiones técnicas PROVISIONALES y
      configurables, no requisitos de negocio.
    - Registro (POST /usuarios) y edición del identificador dependen de decisiones externas (DEP-2 a DEP-5) que
      este contrato no define; su comportamiento final lo fijarán esas specs.
servers:
  - url: /api
security:
  - bearer: []

paths:
  /usuarios:
    get:
      operationId: listarUsuarios
      summary: Listado paginado de usuarios de la empresa actual (FR-009, FR-012, FR-014 a FR-018)
      x-permiso: usuarios.administrar
      parameters:
        - { name: busqueda, in: query, schema: { type: string, maxLength: 200 }, description: 'Coincidencia parcial sobre nombre completo o identificador de acceso (maxLength provisional y configurable)' }
        - { name: rolId, in: query, schema: { type: string, format: uuid } }
        - { name: estado, in: query, schema: { $ref: '#/components/schemas/EstadoUsuario' } }
        - { name: pagina, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: tamanoPagina, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 }, description: 'Valores provisionales y configurables (Usuarios:Paginacion); no son requisito de negocio' }
      responses:
        '200':
          description: Página de resultados. `total` cuenta solo usuarios de la empresa actual que cumplen los criterios.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaUsuarios' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '403': { $ref: '#/components/responses/SinPermiso' }
    post:
      operationId: registrarUsuario
      summary: Registrar un usuario en la empresa actual (FR-020, FR-023 a FR-028)
      description: |
        Depende de la futura spec de autenticación: estado inicial y credencial inicial (DEP-2),
        formato y unicidad del identificador (DEP-3). El límite de usuarios (DEP-5) es externo; esta
        operación solo aplica FR-028 si la fuente externa informa un límite aplicable alcanzado.
      x-permiso: usuarios.registrar
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrarUsuario' }
      responses:
        '201':
          description: Usuario creado. Su estado inicial lo define la futura spec de autenticación (DEP-2).
          headers:
            ETag: { schema: { type: string } }
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetalleUsuario' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '409':
          description: |
            Regla de negocio: `identificador-en-uso` (FR-027; el ámbito de unicidad lo define DEP-3; nunca revela
            la empresa en la que existe), `limite-usuarios-alcanzado` (FR-028: solo si existe un límite externo
            aplicable y se alcanzó), `rol-no-valido` (FR-026).
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } }

  /usuarios/roles-asignables:
    get:
      operationId: listarRolesAsignables
      summary: Roles de la empresa actual, para el formulario y el filtro (FR-015, FR-026)
      x-permiso: usuarios.administrar
      responses:
        '200':
          description: Roles de la empresa actual.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RolResumen' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /usuarios/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: obtenerUsuario
      summary: Detalle de solo lectura (FR-011)
      x-permiso: usuarios.administrar
      responses:
        '200':
          description: Detalle con acciones permitidas.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetalleUsuario' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    put:
      operationId: editarUsuario
      summary: Editar nombre completo y rol; el identificador según lo que defina DEP-4 (FR-021, FR-024 a FR-026, FR-035, FR-036, FR-039)
      x-permiso: usuarios.editar
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EditarUsuario' }
      responses:
        '200':
          description: Usuario modificado. Se registra en la trazabilidad con los valores anterior y nuevo (FR-044).
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetalleUsuario' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: |
            `no-puede-cambiar-su-propio-rol` (FR-035), `ultimo-administrador` (FR-036),
            `rol-no-valido` (FR-026), `identificador-no-editable` (solo si DEP-4 determina que no es editable),
            `identificador-en-uso` (FR-027).
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } }
        '412': { $ref: '#/components/responses/Modificado' }
        '428': { $ref: '#/components/responses/FaltaIfMatch' }

  /usuarios/{id}/desactivacion:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: desactivarUsuario
      summary: Desactivar (la interfaz exige confirmación previa; FR-032 a FR-036)
      x-permiso: usuarios.desactivar
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200':
          description: Usuario Inactivo. Se registra en la trazabilidad.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetalleUsuario' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: '`no-puede-desactivarse-a-si-mismo` (FR-034), `ultimo-administrador` (FR-036).'
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } }
        '412': { $ref: '#/components/responses/Modificado' }
        '428': { $ref: '#/components/responses/FaltaIfMatch' }

  /usuarios/{id}/activacion:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: activarUsuario
      summary: Activar (sin confirmación; FR-030 a FR-032)
      x-permiso: usuarios.activar
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200':
          description: Usuario Activo. Se registra en la trazabilidad.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetalleUsuario' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '412': { $ref: '#/components/responses/Modificado' }
        '428': { $ref: '#/components/responses/FaltaIfMatch' }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }

  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag (versión) obtenido del listado o del detalle. Protege contra cambios concurrentes (FR-038, FR-039).
      schema: { type: string }

  responses:
    NoAutenticado:
      description: '`no-autenticado`'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } }
    SinPermiso:
      description: '`sin-permiso` (FR-005, FR-006). No incluye datos de usuarios.'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } }
    NoEncontrado:
      description: '`usuario-no-encontrado`. Idéntica para un usuario inexistente y para uno de otra empresa (FR-003).'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } }
    Modificado:
      description: '`usuario-modificado`: la versión cambió desde que se cargó. `actual` trae los datos vigentes (FR-038, FR-039).'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemaConflictoVersion' } } }
    ErrorInterno:
      description: |
        `error-interno`: excepción no controlada. ProblemDetails genérico con `type`
        `https://kryon.app/errores/error-interno`, `title` fijo y `codigo: error-interno`. NUNCA incluye stack trace,
        consultas SQL, rutas del servidor, nombres de clases o tipos internos, secretos ni datos de otra empresa.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } }
    FaltaIfMatch:
      description: '`falta-version`: la operación requiere If-Match.'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } }
    Validacion:
      description: '`validacion`: `errors` indica qué corregir en cada campo (FR-025).'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemaValidacion' } } }

  schemas:
    EstadoUsuario:
      type: string
      enum: [activo, inactivo]
      description: Los estados adicionales, si los hay, los define DEP-2.

    AccionesPermitidas:
      type: object
      required: [verDetalle, editar, cambiarRol, editarIdentificador, activar, desactivar]
      properties:
        verDetalle: { type: boolean }
        editar: { type: boolean }
        cambiarRol: { type: boolean, description: false para la propia cuenta (FR-035) }
        editarIdentificador: { type: boolean, description: 'Lo determina la regla de DEP-4 (futura spec de autenticación); este contrato no fija su valor' }
        activar: { type: boolean }
        desactivar: { type: boolean, description: false para la propia cuenta (FR-034) }

    RolResumen:
      type: object
      required: [id, nombre]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }

    UsuarioResumen:
      type: object
      required: [id, nombreCompleto, identificadorAcceso, rol, estado, esCuentaPropia, version, acciones]
      properties:
        id: { type: string, format: uuid }
        nombreCompleto: { type: string }
        identificadorAcceso: { type: string }
        rol:
          description: null si el usuario no tiene un rol reconocido (EC-10). La interfaz muestra "Sin rol asignado".
          oneOf: [ { $ref: '#/components/schemas/RolResumen' }, { type: 'null' } ]
        estado: { $ref: '#/components/schemas/EstadoUsuario' }
        esCuentaPropia: { type: boolean }
        version: { type: string, description: Mismo valor que el ETag }
        acciones: { $ref: '#/components/schemas/AccionesPermitidas' }

    DetalleUsuario:
      allOf: [ { $ref: '#/components/schemas/UsuarioResumen' } ]

    PaginaUsuarios:
      type: object
      required: [elementos, total, pagina, tamanoPagina, puedeRegistrar]
      properties:
        elementos: { type: array, items: { $ref: '#/components/schemas/UsuarioResumen' } }
        total: { type: integer, minimum: 0 }
        pagina: { type: integer }
        tamanoPagina: { type: integer }
        puedeRegistrar: { type: boolean, description: 'Capacidad de registrar (nombre provisional usuarios.registrar; FR-020, US5)' }

    RegistrarUsuario:
      type: object
      additionalProperties: false
      required: [nombreCompleto, identificadorAcceso, rolId]
      properties:
        nombreCompleto: { type: string, minLength: 1, maxLength: 200, description: 'maxLength provisional y configurable' }
        identificadorAcceso: { type: string, minLength: 1, maxLength: 256, description: 'maxLength provisional y configurable; formato según DEP-3' }
        rolId: { type: string, format: uuid }

    EditarUsuario:
      type: object
      additionalProperties: false
      required: [nombreCompleto, rolId]
      properties:
        nombreCompleto: { type: string, minLength: 1, maxLength: 200, description: 'maxLength provisional y configurable' }
        rolId: { type: string, format: uuid }
        identificadorAcceso: { type: string, maxLength: 256, description: 'Campo previsto para cuando DEP-4 se resuelva; se acepta o rechaza según esa regla. maxLength provisional' }

    Problema:
      type: object
      required: [type, title, status, codigo]
      properties:
        type: { type: string, format: uri, example: 'https://kryon.app/errores/ultimo-administrador' }
        title: { type: string }
        status: { type: integer }
        codigo:
          type: string
          enum:
            - no-autenticado
            - sin-permiso
            - usuario-no-encontrado
            - validacion
            - rol-no-valido
            - identificador-en-uso
            - identificador-no-editable
            - limite-usuarios-alcanzado
            - no-puede-desactivarse-a-si-mismo
            - no-puede-cambiar-su-propio-rol
            - ultimo-administrador
            - usuario-modificado
            - falta-version
            - error-interno

    ProblemaValidacion:
      allOf:
        - { $ref: '#/components/schemas/Problema' }
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              additionalProperties: { type: array, items: { type: string } }

    ProblemaConflictoVersion:
      allOf:
        - { $ref: '#/components/schemas/Problema' }
        - type: object
          required: [actual]
          properties:
            actual: { $ref: '#/components/schemas/DetalleUsuario' }
